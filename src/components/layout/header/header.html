<header data-fls-header class="header">
   <!-- Логотип компанії -->
   <a class="header__logo" href="/" aria-label="Рекламно-виробнича компанія Мега Компроміс" title="Рекламно-виробнича компанія Мега Компроміс">
      <img class="header__logo-img" data-fls-image-ignore src="@img/global/logo.webp" alt="Логотип компанії Мега Компроміс" loading="lazy">
   </a>

   <!-- Панель пошуку -->
   <div class="search" role="search">
      <div class="search__panel" data-search-panel>
         <svg class="search__icon" aria-hidden="true" focusable="false">
            <use xlink:href="__spritemap#sprite-search"></use>
         </svg>
         <form class="search__panel-form" action="/" role="search" aria-label="Форма пошуку по сайту">
            <input
               class="search__input"
               type="search"
               name="search"
               data-sait-search
               placeholder="Пошук"
               autocomplete="off"
               size="1"
               aria-label="Пошук товару"
            >
         </form>
         <button 
            type="button" 
            class="search__input-clean" 
            data-name="search__input-clean" 
            aria-label="Очистити поле пошуку"
         ></button>
      </div>

      <!-- Модалка з результатами пошуку -->
      <div
         class="search__modal"
         data-name="search-modal"
         role="dialog"
         aria-modal="true"
         aria-labelledby="search-modal-title"
         tabindex="-1"
      >
         <button
            class="search__modal-close"
            data-close-modal="search-modal"
            type="button"
            aria-label="Закрити результати пошуку"
         ></button>

         <!-- Назва для скрінрідерів (видимий заголовок не обов'язковий) -->
         <h2 class="title-visually-hidden">Результати пошуку</h2>
         <!-- Блок для виводу результатів пошуку -->
         <ul class="search__results" data-container="search-results">
            <!-- Вітальне повідомленя з інструукцією по початку пошуку -->
            <p class="search__welcome-text" data-welcome-search>Для початку пошуку, почніть вводити назву товару або номер артиклю.
               <br>Необхідно ввести мінімум 3 символи.
            </p>
         </ul>
      </div>
   </div>

   <!-- Вибір мови сторінки -->
   <a
      class="header__language"
      href="/ru/"
      aria-label="Перекласти сторінку на російську"
      title="Перекласти сторінку"
   >
      <img
         data-fls-image-ignore
         src="@img/global/ork.webp"
         alt="Прапор: російська мова"
         width="40"
      >
   </a>
</header>
