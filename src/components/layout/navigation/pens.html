<div class="group-wrapper _pens-wrapper" data-name="pens">
  <ul class="group-block pens">

    <!-- Заголовок групи -->
    <li class="signboard _pens">
      <div class="signboard__img">
        <svg aria-label="Ручки" role="img" focusable="false" class="signboard__svg">
          <use xlink:href="__spritemap#sprite-pens"></use>
        </svg>
      </div>
      <header class="signboard__txt">
        <h2 class="signboard__title">Ручки</h2>
        <p class="signboard__paragraph">Ручки з логотипом</p>

    <!-- Горизонтальний великий блок -->
    <li class="type-board type-board-pens horizontal-large">
      <div class="type-board__img">
        <svg aria-label="Друк на ручках" role="img" focusable="false" class="type-board__svg">
          <use xlink:href="__spritemap#sprite-group-pens"></use>
        </svg>
      </div>
      <ul class="type-board__txt">
        <li><a href="/print-pen/" class="type-board__link">Друк на ручках</a></li>
        <li><a href="/print-pen/catalog-pen/#plastic" class="type-board__link">Пластикові ручки</a></li>
