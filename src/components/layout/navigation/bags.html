<div class="group-wrapper _bags-wrapper" data-name="bags">
  <button data-fls-button type="button" class="group-wrapper__close-button" data-name="group-wrapper-close-button"></button>
  <ul class="group-block _bags" role="list">

    <!-- Заголовок -->
    <li class="signboard _bags" role="listitem">
      <div class="signboard__img">
        <svg aria-label="Сумки та пакети" role="img" focusable="false" class="signboard__svg">
          <use xlink:href="__spritemap#sprite-bags"></use>
        </svg>
      </div>
      <header class="signboard__txt">
        <h2 class="signboard__title">Сумки та пакети</h2>
        <p class="signboard__paragraph">Сумки та пакети з логотипом</p>
      </header>
    </li>

    <!-- Горизонтальний великий блок -->
    <li class="type-board type-board-bags _horizontal-large" role="listitem">
      <div class="type-board__img">
        <svg aria-label="Паперові пакети з лого" role="img" focusable="false" class="type-board__svg">
          <use xlink:href="__spritemap#sprite-papire-bags"></use>
        </svg>
      </div>
      <div class="type-board__txt">
        <a href="/print-paper-bags/" class="type-board__link" title="Паперові пакети з лого">Паперові пакети з лого</a>
        <a href="/print-paper-bags/craft-packages/" class="type-board__link" title="Крафтові пакети з нанесенням">Крафтові пакети з нанесенням</a>
        <a href="/print-paper-bags/catalog-paper-bags/" class="type-board__link" title="Каталог паперових пакетів">Каталог паперових пакетів</a>
      </div>
    </li>

    <!-- Горизонтальний середній блок (пластикові пакети) -->
    <li class="type-board type-board-bags _horizontal-mid" role="listitem">
      <div class="type-board__horizontal-mid-img">
        <svg aria-label="Друк на пластикових пакетах" role="img" focusable="false" class="type-board__svg _horizontal-mid-svg">
          <use xlink:href="__spritemap#sprite-plastik-bags"></use>
        </svg>
      </div>
      <a href="/print-plastic-bags/" class="type-board__link" title="Друк на пластикових пакетах">Друк на пластикових пакетах</a>
      <a href="/print-plastic-bags/catalog-plastic-bags/" class="type-board__link" title="Каталог поліетиленових пакетів">Каталог поліетиленових пакетів</a>    
    </li>

    <!-- Горизонтальний середній блок (еко-сумки) -->
    <li class="type-board type-board-bags _horizontal-mid" role="listitem">
      <div class="type-board__horizontal-mid-img">
        <svg aria-label="Друк на еко-сумках" role="img" focusable="false" class="type-board__svg _horizontal-mid-svg">
          <use xlink:href="__spritemap#sprite-eco-bags"></use>
        </svg>
      </div>
      <a href="/print-eco-bags/" class="type-board__link" title="Друк на еко-сумках">Друк на еко-сумках</a>
      <a href="/print-eco-bags/catalog-eco-bags/" class="type-board__link" title="Каталог сумок">Каталог сумок</a>
    </li>

    <!-- Горизонтальний маленький блок (рюкзаки) -->
    <li role="listitem" class="type-board type-board-bags _horizontal-small">
      <a href="/print-backpacks/catalog-backpacks/" class="type-board__link" title="Рюкзаки">
        <div class="horizontal-small__txt">
          <p class="horizontal-small__paragraph">Рюкзаки</p>
        </div>
      </a>
    </li>

  </ul>
</div>
