<div data-fls-componentEditMenu class="component-edit-menu-container _view" data-component="component_edit_menu"
   data-part="root">
   <!-- Хедер меню -->
   <header class="menu-header">
      <button class="menu-header__close" type="button" data-action="close-menu" data-target="edit-menu"
         aria-label="Закрити меню"></button>
      <p class="menu-header__title">Меню редагування параметрів секції</p>
   </header>

   <div class="component-edit-menu-container__items-wraper" action="/setup/section/select/" title="select section"
      method="post" enctype="multipart/form-data">

      <!-- Навігаційний блок меню -->
      <div class="component-edit-menu-container__menu-navigation-block">
         <p class="component-edit-menu-container__items-title">Елементи секції</p>
         <div class="component-edit-menu-container__menu-navigation-items">
            <a class="component-edit-menu-container__item" href="#titleh2" title="title">Title h2</a>
            <a class="component-edit-menu-container__item" href="#subtitle" title="subtitle">Subtitle</a>
            <a class="component-edit-menu-container__item" href="#text" title="text">Text</a>
            <a class="component-edit-menu-container__item" href="#img" title="img" data-name="btn"
               data-id="param-1">Image</a>
            <a class="component-edit-menu-container__item" href="#list" title="list" data-name="btn"
               data-id="param-2">List</a>
            <a class="component-edit-menu-container__item" href="#btn" title="btn" data-name="btn"
               data-id="param-3">Button</a>
            <a class="component-edit-menu-container__item" href="#textlink" title="link" data-name="btn"
               data-id="param-4">Text link</a>
            <a class="component-edit-menu-container__item" href="#imagelink" title="link" data-name="btn"
               data-id="param-5">Image link</a>
            <!-- Кнопка "Додати елемент" -->
            <button type="button" class="component-edit-menu-container__add-component-element"></button>
         </div>
      </div>

      <!-- Блок введення данних меню -->
      <ul class="component-edit-menu-container__items-list">
         <li class="component-edit-menu-container__item-tile _element_selection_animation">
            <form class="component-edit-menu-container__form" id="titleh2">
               <p class="component-edit-menu-container__item-tile-name">Назва компоненту</p>
               <textarea class="component-edit-menu-container__param-input" name="param-input" data-autosize="true" data-placeholder="Введіть значення…">Значення компоненту/змінної</textarea>
               <!-- Кнопка "Підтвердження змін" -->
               <input type="submit" class="component-edit-menu-container__submit-btn" type="submit" value="OK">
               <!-- Кнопка "Додати input" -->
               <button type="button" class="component-edit-menu-container__add-input-btn"></button>
            </form>
            <!-- Блок кнопок "Налаштування", "Видалити" -->
            <div class="component-edit-menu-container__buttons-block">
               <!-- Кнопка "Налаштування" -->
               <button class="component-edit-menu-container__block-settings-btn" type="button" title="Налаштування блоку">
                  <svg class="component-edit-menu-container__block-settings-btn-svg">
                     <use xlink:href="__spritemap#sprite-GearNew"></use>
                  </svg>
               </button>
               <!-- Кнопка "Видалити" -->
               <button class="component-edit-menu-container__del-button" type="button" title="Налаштування блоку">
                  <svg class="component-edit-menu-container__del-button-svg">
                     <use xlink:href="__spritemap#sprite-del_btn"></use>
                  </svg>
               </button>
            </div>
         </div>
      </ul>
   </div>
</div>
