<!-- Успішна відправка форми -->
<div class="contact-form-modal _view" data-name="contact-form-modal">
   <div class="contact-form-close" data-remove-modal="contact-form-modal"></div>
   <img class="contact-form-modal__pic" data-fls-image-ignore src="@img/global/Thumb_up_for_alarm.webp"
      alt="Виконано успішно">
   <h3 class="contact-form-modal__title">Успішно!</h3>
   <p class="contact-form-modal__txt">Запит надіслано! Ми зв’яжемося з вами найближчим часом.</p>
</div>
