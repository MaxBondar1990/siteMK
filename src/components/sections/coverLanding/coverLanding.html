<section data-fls-cover class="cover _t-shirts" aria-label="Обкладинка сайту рекламної агенції МК">
  <picture class="cover__pic">
    <img class="cover__img" src="@img/coverLanding/coverLanding.webp" title="Обкладинка рекламної агенції МК" alt="Обкладинка рекламної агенції МК" />
  </picture>

  <div class="cover__content">
    <h1 class="cover__title _color-title" id="cover-title">
      [[title]]
    </h1>
    <p class="cover__txt _color-txt" lang="uk-UA" id="cover-description">
      Футболки, чашки, ручки, пакети, кепки та десятки інших позицій. Допоможемо з дизайном, виготовимо в термін від 2 днів, доставимо по всій Україні.
    </p>
    <button class="cover__button _button-wht" data-action="open-modal" data-target="contact-form" data-part="button" type="button" aria-label="Замовити послугу"
    >
      Замовити
    </button>
  </div>
     <include src="@components/custom/modal/modal.html" locals='{
      "addClass": "",
      "modalName": "contact-form",
      "closeOrRemove": "close",
      "dirName": "custom",
      "fileName": "contactform"
   }'></include>
</section>
