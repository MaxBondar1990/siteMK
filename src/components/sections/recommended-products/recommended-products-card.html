<article data-fls-recommended-products-card 
         class="recommended-products-card" 
         data-component="recommended_products_card" 
         data-part="root" 
         aria-labelledby="recommended-products-card"
         itemscope 
         itemtype="https://schema.org/Product">

    <a class="recommended-products-card__items" 
       href="http://localhost:5500/recommended-products.html" 
       title="Детальніше про толстовку"
       itemprop="url">

        <img class="recommended-products-card__items-img" 
             data-fls-image-ignore
             src="@img/goods/CLASSIC-HOODED-SWEAT_021.webp" 
             alt="Толстовка унісекс з логотипом" 
             itemprop="image" />

        <div class="recommended-products-card__items-info">
            <h3 class="recommended-products-card__title" itemprop="name">
                Толстовка унісекс
            </h3>

            <p class="recommended-products-card__brand">
                <span itemprop="brand" itemscope itemtype="https://schema.org/Brand">
                    <meta itemprop="name" content="Fruit of the Loom" />
                    Fruit of the Loom Fruit of the Loom
                </span>
            </p>

            <p class="recommended-products-card__price" 
               itemprop="offers" 
               itemscope 
               itemtype="https://schema.org/Offer">
                <span itemprop="price">425.00</span> 
                <meta itemprop="priceCurrency" content="UAH" />
                грн
                <link itemprop="availability" href="https://schema.org/InStock" />
            </p>
        </div>
    </a>

    <meta itemprop="sku" content="FOTL-HOODIE-001" />
    <meta itemprop="description" content="Комфортна толстовка унісекс з бавовни, ідеальна для нанесення логотипу або корпоративного брендування." />

</article>
