<section data-fls-cover class="cover _snowfall" style="--bg: linear-gradient(180deg,rgba(245, 245, 245, 1) 0%, rgba(140, 149, 173, 1) 26%, rgba(31, 62, 133, 1) 50%, rgba(20, 38, 82, 1) 100%)" data-component="cover" data-part="root"
   aria-label="Обкладинка сайту рекламної агенції МК">
   <!-- СНІГ -->
   <div class="snowfall" aria-hidden="true"></div>
   <div class="snowfall _extra" aria-hidden="true"></div>

   <picture class="cover__pic">
      <img class="cover__img" src="@img/cover/coverChristmasHoodie.webp" title="Обкладинка рекламної агенції МК"
         alt="Обкладинка рекламної агенції МК"/>
   </picture>

   <div class="cover__content">
      <h1 class="cover__title" style="--color: #f7931e; --titleWidth: 80%" id="cover-title" data-part="title">
         [[title]]
      </h1>
      <p class="cover__txt" style="--txtColor: #f5f5f5" lang="uk-UA" id="cover-description" data-part="description">
         Футболки, чашки, ручки, пакети, кепки та десятки інших позицій. Допоможемо з дизайном, виготовимо в термін від
         2 днів, доставимо по всій Україні.
      </p>
      <button class="cover__button" style="--btnColor: #4170b4; --btnBg: #f5f5f5; --btnBorderColor: #4170b4" data-action="open-modal" data-target="contact-form" data-part="button" type="button"
         aria-label="Замовити послугу">
         Замовити
      </button>
   </div>
   <include src="@components/custom/modal/modal.html" locals='{
      "addClass": "",
      "modalName": "contact-form",
      "closeOrRemove": "close",
      "dirName": "custom",
      "fileName": "contactform"
   }'></include>
</section>
